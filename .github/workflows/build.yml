name: Build PitchKernel

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Build script — only build.sh (AOSP+MIUI dual zip) is currently supported. build-miui.sh (MIUI-only) is not wired into the packaging step yet.'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh
      variants:
        # NOTE: this description is a static string — GitHub Actions evaluates
        # workflow_dispatch.inputs at trigger-definition time, before the
        # matrix even exists, so it cannot reference matrix.root_provider
        # below. Root providers are now set per matrix entry (see
        # matrix.include further down) rather than as a job-level env var,
        # specifically so adding one doesn't require touching this comment
        # or any label elsewhere in the file by hand -- that manual-edit
        # requirement is exactly what caused this repo to say "KernelSU
        # Next" in five places after switching back to ReSukiSU.
        #
        # PitchKernel: replaces the old `ksu` boolean (true/false = root/no-root).
        # That boolean never had a concept of "ReSukiSU without SUSFS" -- SUSFS
        # was bundled into the single "enabled" state. This input selects which
        # of three independent build variants to run, each as its own matrix
        # job entry, all reusing the same job body. See the `variant` matrix
        # strategy below for how each choice maps to KSU_ENABLE/SUSFS_ENABLE.
        description: 'Which variant(s) to build'
        required: true
        type: choice
        default: 'nosusfs-only'
        options:
          - 'nosusfs-only'
          - 'kernelsu-only'
          - 'vanilla-only'
      skip_ccache:
        description: 'DIAGNOSTIC: skip restoring ccache for this run (forces a full rebuild, use to rule out stale-cache issues)'
        required: false
        type: boolean
        default: false
      source_branch_override:
        description: 'DIAGNOSTIC: build a different branch of MujinnPark/pitch_kernel_sm8250 for this run only (e.g. a feature branch under test). Leave empty for the normal pinned main branch -- see the "PINNED ON PURPOSE" comment on the clone step before changing the default.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: PitchKernel munch (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      # PitchKernel: one job body, matrix'd across variants instead of
      # duplicating the whole pipeline per variant. Each matrix entry sets
      # ksu_enable / label / zip_type independently so build.sh's third
      # positional arg (nosusfs) and every downstream label/artifact-name/
      # gate step can key off matrix.* instead of a single ksu boolean.
      # fail-fast: false so one variant failing does not cancel the other
      # variant's otherwise-healthy build -- each variant ships or fails on
      # its own merit, as required.
      #
      # SUSFS variant removed (see commit that removed it): ReSukiSU's main
      # branch hook code (kernel/hook/setuid_hook.c, kernel/feature/
      # sucompat.c) calls a susfs_*no_su*/susfs_set_sdcard_android_data_
      # decrypted_key_false API family that no SUSFS source available for
      # this 4.19 non-GKI target actually defines -- confirmed against both
      # the vendored SUSFS 2.2.0 tree and susfs4ksu's kernel-4.19 branch.
      # susfs_enable is gone from every matrix entry; ksu_enable (ReSukiSU,
      # no SUSFS) and the vanilla no-root build remain.
      #
      # PitchKernel: added a third root provider, plain KernelSU (EmanuelCN
      # fork, vendored as a submodule at KernelSU/ in the kernel repo --
      # see pitch_kernel_sm8250's .gitmodules). Each matrix entry now
      # carries its own root_arg (literal apasitu/build.sh positional args),
      # root_provider (human-readable) and root_solution_key (machine key
      # matching a telegram.sh case) instead of relying on the old
      # job-level ROOT_PROVIDER/ROOT_SOLUTION_KEY env vars -- those cannot
      # hold two different values for two different root-providing matrix
      # entries in the same run, which this change now requires. ksu_enable
      # is kept as a simple "is any root provider active" boolean so the
      # existing matrix.ksu_enable checks elsewhere in this file (SUSFS
      # verification gate, uclamp gate) keep working unchanged for both
      # root variants.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          inputs.variants == 'vanilla-only' && '[{"label":"Vanilla-NoRoot","ksu_enable":"false","root_arg":"","root_provider":"none","root_solution_key":"VANILLA","zip_type":"stock"}]' ||
          inputs.variants == 'kernelsu-only' && '[{"label":"KernelSU","ksu_enable":"true","root_arg":"kernelsu","root_provider":"KernelSU (EmanuelCN)","root_solution_key":"KERNELSU","zip_type":"kernelsu"}]' ||
          '[{"label":"ReSukiSU-NoSUSFS","ksu_enable":"true","root_arg":"ksu nosusfs","root_provider":"ReSukiSU","root_solution_key":"RESUKISU_NOSUSFS","zip_type":"resukisu-nosusfs"}]'
          ) }}

    steps:
      - name: Checkout PitchKernel repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Notify build started
        run: |
          LABEL="${{ matrix.label }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "message_thread_id=${{ secrets.TELEGRAM_THREAD_ID_EVENT }}" \
            -d "disable_web_page_preview=true" \
            -d "text=🔨 PitchKernel — Build Started%0ADevice: munch (Poco F4)%0AType: ${LABEL} — ${{ inputs.script }}%0ADate: $(date +'%Y-%m-%d %H:%M UTC')" | jq '.ok'

      - name: Guard unsupported build script selection
        run: |
          if [ "${{ inputs.script }}" != "build.sh" ]; then
            echo "FATAL: ${{ inputs.script }} is not wired into the packaging step."
            echo "The Package zip step requires both PitchKernel_AOSP_*.zip and PitchKernel_MIUI_*.zip."
            echo "build-miui.sh only produces the MIUI zip. Wire up packaging before enabling."
            exit 1
          fi
          echo "Build script: ${{ inputs.script }} — OK"

      - name: Cleanup disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget \
            bison flex zip bc cpio libssl-dev \
            python-is-python3 gcc-aarch64-linux-gnu \
            device-tree-compiler

      - name: Clone apasitu kernel source
        env:
          # PINNED ON PURPOSE. Do not remove -b / add --no-single-branch back.
          #
          # Real incident (found by log/repo audit, 2026-07-03): this step used to
          # clone with --no-single-branch and no -b flag, which pulls whatever
          # AstideLabs' default HEAD branch happens to be. At the time of the audit
          # that was `android16-aptusitu` — NOT `android16-aptusitu-new`, which is
          # the branch this project's docs/CI have always assumed. Diffed the two:
          # 6,597 files / ~1.39M lines different. They are not close variants.
          # Every build run before this fix may have silently built the wrong tree
          # with no error, because both branches have a valid build.sh/build-miui.sh
          # and both build successfully — there's no structural signal that you got
          # the wrong one. If the default branch changes again, or if you
          # deliberately mean to track a different branch, that's fine — just make
          # the change here, explicitly, and update KERNEL_SOURCE_BRANCH below to
          # match. Do not go back to letting `git clone` pick for you.
          #
          # 2026-08-18: source repo migrated from MujinnPark/android_kernel_xiaomi_sm8250
          # (branch android16-pitchkernel) to MujinnPark/pitch_kernel_sm8250 (branch
          # main) -- full history preserved via force-push mirror, content-verified
          # against the walt.c tripwire below before this migration was made. The old
          # repo is being kept around (archived, not deleted) as a fallback; if this
          # pin is ever reverted, revert branch to android16-pitchkernel too, they are
          # not interchangeable across repos.
          #
          # source_branch_override (originally added for PitchKernel MGLRU
          # phase-by-phase testing, kept as general-purpose infra after that
          # backport was reverted): only takes effect when explicitly set on
          # workflow_dispatch. Empty input -> falls through to the pinned
          # main default below, same as before this input
          # existed. This is a per-run diagnostic override, not a replacement
          # for updating the
          # pin above if you actually want to permanently track a different
          # branch.
          KERNEL_SOURCE_BRANCH: ${{ inputs.source_branch_override != '' && inputs.source_branch_override || 'main' }}
        run: |
          if [ -n "${{ inputs.source_branch_override }}" ]; then
            echo "::warning::source_branch_override set — building '${KERNEL_SOURCE_BRANCH}' instead of the pinned main branch"
          fi
          echo "Cloning branch: ${KERNEL_SOURCE_BRANCH} (pinned explicitly — see step comment)"
          # PitchKernel: this clone runs from inside kernel_xiaomi_munch's
          # own checked-out working directory (GHA's default cwd for a
          # run: step), which actions/checkout@v4's persist-credentials
          # has set a --local http.https://github.com/.extraheader on
          # (confirmed in the Checkout step's log -- git config --local,
          # not --global). Adding --recurse-submodules below is what
          # surfaced this: run 90266761349 failed immediately at "Cloning
          # into 'apasitu'..." with "fatal: could not read Username for
          # 'https://github.com': No such device or address" -- the exact
          # symptom of a non-interactive git hitting a credential prompt
          # it can't answer. The precise mechanism by which a --local
          # extraheader set on the ambient cwd's repo affects a brand-new
          # `git clone` into a different subdirectory (apasitu is not
          # itself a git repo yet at the point this runs) is not fully
          # pinned down, but the fix used by every real-world report of
          # this exact error (actions/runner#3051, several GitLab CI
          # threads) is the same: explicitly clear the relevant config for
          # this one command via -c, and disable the interactive-prompt
          # fallback so any future auth requirement fails fast and
          # legibly instead of hanging or emitting this cryptic message.
          # Does not touch persist-credentials on the checkout step
          # itself (step 2), which still needs it for anything later in
          # the job that pushes back to this repo.
          GIT_TERMINAL_PROMPT=0 git -c http.https://github.com/.extraheader= -c credential.helper= \
            clone --depth=1 --single-branch --recurse-submodules -b "${KERNEL_SOURCE_BRANCH}" \
            https://github.com/MujinnPark/pitch_kernel_sm8250.git \
            apasitu
          ls apasitu/build.sh apasitu/build-miui.sh
          echo "--- Verifying KernelSU submodule was actually populated (not left empty) ---"
          if [ ! -f apasitu/KernelSU/kernel/Kconfig ]; then
            echo "::error::apasitu/KernelSU/kernel/Kconfig missing -- submodule did not clone. Check --recurse-submodules and .gitmodules."
            exit 1
          fi
          echo "OK: KernelSU submodule populated."
          RESOLVED_SHA=$(git -C apasitu rev-parse --short HEAD)
          echo "KERNEL_SOURCE_BRANCH=${KERNEL_SOURCE_BRANCH}" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_SHA=${RESOLVED_SHA}" >> $GITHUB_ENV
          echo "Resolved to commit: ${RESOLVED_SHA}"
          echo "--- Verifying kernel/sched/walt.c margin_up initializer content ---"
          grep -n -A2 "sysctl_sched_capacity_margin_up\[MAX_MARGIN_LEVELS\]" apasitu/kernel/sched/walt.c || echo "PATTERN NOT FOUND"

      - name: Apply bypass charging patch
        run: |
          echo "Applying bypass charging patch to apasitu (branch=${KERNEL_SOURCE_BRANCH}, sha=${KERNEL_SOURCE_SHA})"
          cd apasitu
          git apply --check ../PitchKernel/patches/bypass_charging_munch.patch
          git apply ../PitchKernel/patches/bypass_charging_munch.patch
          echo "Patch applied cleanly."

      - name: CPU baseline benchmark
        run: |
          echo "nproc: $(nproc)"
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "BUILD_START_EPOCH=$(date +%s)" >> $GITHUB_ENV
          openssl speed -seconds 2 aes-256-cbc 2>&1 | tail -3
          # PitchKernel: DIAGNOSTIC, one-line check, not a build. Testing
          # whether this runner's make is >=4.4, which changed SIGPIPE
          # handling for child processes (make ignores SIGPIPE for children
          # since 4.4, so a subprocess writing to a closed pipe gets EPIPE
          # as a normal error return instead of dying silently to the
          # signal -- documented cause of an almost identical "broken pipe"
          # crash in `find` during kbuild, see LKML "Kernel builds now
          # failing" Jan 2023 thread). This does not prove make is the
          # cause of the "LLVM ERROR: IO failure on output stream: Broken
          # pipe" pattern (LTO, ccache, and -j parallelism are already
          # ruled out with direct build-log evidence) -- it only checks
          # whether this specific variable is even in play before spending
          # another 10+ minute diagnostic build on it.
          echo "make version:"
          make --version | head -1

      - name: Setup ZyCromerZ Clang
        # PitchKernel: root cause of "LLVM ERROR: IO failure on output
        # stream: Broken pipe" (present in every build from at least run
        # 29497655576 onward, 463/376/304/452/319 occurrences across
        # different runs) was Neutron clang 23.0.0git, a development
        # snapshot built from an unreleased commit
        # (12628715ce61c8db841211eb8683e2f53fa74f0b). Confirmed by
        # elimination against direct build-log evidence, not assumption:
        #   - Not LTO: never enabled in any build this repo produces --
        #     build.sh explicitly runs `scripts/config -d LTO_CLANG -e
        #     LTO_NONE` before every real make call, overriding
        #     munch_defconfig's CONFIG_LTO_CLANG=y.
        #   - Not ccache: bypassing it entirely (PITCHKERNEL_NO_CCACHE=1)
        #     made the count worse (304 -> 452), not better.
        #   - Not make -j parallelism: fully serial (PITCHKERNEL_SERIAL_
        #     BUILD=1, -j1) still hit 319 occurrences.
        #   - Not make's SIGPIPE-ignore-for-children behavior (introduced
        #     in make 4.4) -- this runner's make --version is 4.3.
        # Switching to ZyCromerZ Clang 16.0.6-20260807, a numbered stable
        # release, eliminated the error entirely: run 80019238803, 0
        # occurrences, full pipeline green through release publish. This
        # matches this project's own documented intended toolchain
        # (ZyCromerZ Clang 16.0.6), which had drifted to the Neutron dev
        # snapshot at some point not captured in this repo's history.
        #
        # Directory is named neutron-clang for historical/compatibility
        # reasons -- NOT a leftover to clean up. build.sh hardcodes
        # TOOLCHAIN_PATH=$HOME/neutron-clang/bin (see build.sh line ~7);
        # renaming this directory requires updating that line in build.sh
        # in the same change, not independently.
        #
        # PITCHKERNEL_NO_CCACHE and PITCHKERNEL_SERIAL_BUILD flags remain
        # available in build.sh for future re-diagnosis if a different
        # broken-pipe-class issue ever appears, but should stay unset for
        # normal builds.
        run: |
          mkdir -p "$HOME/neutron-clang"
          cd "$HOME/neutron-clang"
          curl -LO "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
          if [ ! -s "Clang-16.0.6-20260807.tar.gz" ]; then
            echo "::error::Download of ZyCromerZ Clang 16.0.6 tarball failed or produced an empty file. If ZyCromerZ has rolled this tag forward or removed it, check https://github.com/ZyCromerZ/Clang/releases for the current 16.0.6 asset filename and update the curl line above and the tar/rm lines below to match."
            exit 1
          fi
          tar -xzf "Clang-16.0.6-20260807.tar.gz"
          rm -f "Clang-16.0.6-20260807.tar.gz"
          if [ ! -x "$HOME/neutron-clang/bin/clang" ]; then
            echo "::error::Extracted archive does not contain bin/clang at the expected path. The archive's internal directory structure may differ from what was assumed -- inspect it manually."
            ls -la "$HOME/neutron-clang"
            exit 1
          fi

      - name: Verify ATFWD-daemon not excluded from sucompat
        run: |
          if grep -rq "ATFWD-daemon" apasitu/kernel/ksu/ 2>/dev/null; then
            echo "FATAL: ATFWD-daemon still present in KernelSU source after patch step."
            grep -rn "ATFWD-daemon" apasitu/kernel/ksu/
            exit 1
          fi
          echo "OK: ATFWD-daemon not found in KernelSU exclusion source."

      - name: Set PitchKernel name
        run: |
          echo "-pitchkernel" > apasitu/localversion-st
          echo "" > apasitu/localversion-cip

      - name: Neutralize apasitu's AnyKernel3 clone (use vendored copy instead)
        # PitchKernel: this step used to rewrite build.sh/build-miui.sh's
        # AstideLabs/AnyKernel3 clone URL to point at MujinnPark/AnyKernel3 --
        # a fork under this account. That fork was deleted, and this step kept
        # rewriting to a dead URL, which is what actually broke CI: build.sh's
        # `git clone` step (not this sed, which succeeds regardless of whether
        # the target URL is alive) then failed with a 404.
        #
        # Root cause was never "still cloning the deleted fork by accident" --
        # this step deliberately did that every run. The fix removes the
        # runtime clone dependency entirely instead of re-pointing it at yet
        # another external URL that can go away again. AnyKernel3 (AstideLabs
        # base + PitchKernel overlay) is now vendored at
        # PitchKernel/anykernel-vendor/ in THIS repo -- see "Verify vendored
        # AnyKernel3 overlay is intact" step below, which checks it survived
        # build.sh's execution correctly.
        #
        # IMPORTANT (found and fixed by an actual dry-run, not assumed): build.sh
        # also runs an unconditional `rm -rf anykernel/` immediately BEFORE its
        # (now neutralized) clone line -- this existed to clear a stale dir ahead
        # of the fresh clone that used to repopulate it. With the clone gone,
        # that same `rm -rf` would silently delete the seeded vendored copy below
        # and leave anykernel/ empty for the rest of build.sh's run. That line is
        # therefore also removed here, not just the clone -- removing only the
        # clone and leaving this rm in place was tried first and confirmed broken
        # in a dry run before this version was written.
        run: |
          sed -i 's@git clone https://github.com/AstideLabs/AnyKernel3 -b master --single-branch --depth=1 anykernel@true  # PitchKernel: clone disabled, vendored copy seeded in CI workflow before build.sh runs@' \
            apasitu/build.sh apasitu/build-miui.sh
          sed -i '/^rm -rf anykernel\/$/d' apasitu/build.sh apasitu/build-miui.sh

          echo "Confirming no live git clone of any AnyKernel3 remains in build.sh/build-miui.sh:"
          if grep -n "git clone.*AnyKernel3" apasitu/build.sh apasitu/build-miui.sh; then
            echo "::error::A live AnyKernel3 clone is still present after neutralization -- sed pattern did not match, fix the pattern above."
            exit 1
          fi
          echo "OK: no remaining AnyKernel3 clone in either script."

          echo "Confirming the top-level 'rm -rf anykernel/' cleanup was also removed:"
          if grep -n "^rm -rf anykernel/$" apasitu/build.sh apasitu/build-miui.sh; then
            echo "::error::rm -rf anykernel/ still present -- it will delete the seeded vendored copy below before build.sh finishes. Fix the sed pattern above."
            exit 1
          fi
          echo "OK: no destructive top-level anykernel/ wipe remains (rm -rf anykernel/kernels/ later in both scripts is untouched and still runs normally)."

          # CRITICAL ORDERING: build.sh's own `cd anykernel; zip ...` packaging
          # runs DURING build.sh, before this workflow's later "Package zip" step
          # ever executes. apasitu/anykernel/ must already be populated *now*, or
          # build.sh's internal packaging breaks before this workflow gets
          # anywhere near it. This is not the same check as "Verify vendored
          # AnyKernel3 overlay is intact" further down -- that step re-verifies
          # after build.sh has run (build.sh's only remaining anykernel-related
          # cleanup, `rm -rf anykernel/kernels/`, only clears the kernels/
          # subdir, so everything else placed here survives untouched).
          echo "Seeding apasitu/anykernel from vendored PitchKernel/anykernel-vendor..."
          rm -rf apasitu/anykernel
          cp -r PitchKernel/anykernel-vendor apasitu/anykernel
          [ -f apasitu/anykernel/tools/ak3-core.sh ] || { echo "::error::vendored ak3-core.sh missing after seed copy"; exit 1; }
          [ -f apasitu/anykernel/anykernel.sh ] || { echo "::error::vendored anykernel.sh missing after seed copy"; exit 1; }
          echo "OK: apasitu/anykernel seeded from vendored tree ($(find apasitu/anykernel -type f | wc -l) files)."

      - name: Patch defconfig
        run: |
          DEFCONFIG="apasitu/arch/arm64/configs/munch_defconfig"
          [ -f "$DEFCONFIG" ] || { echo "ERROR: $DEFCONFIG not found"; exit 1; }

          sed -i 's/CONFIG_LOCALVERSION="-aptusitu-perf"/CONFIG_LOCALVERSION=""/' "$DEFCONFIG"

          cd apasitu
          ./scripts/config --file arch/arm64/configs/munch_defconfig \
            --disable LOCALVERSION_AUTO
          cd ..

          {
            echo ""
            echo "# TCP congestion control - PitchKernel"
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_DEFAULT_BBR=y"
            # CONFIG_DEFAULT_TCP_CONG intentionally omitted: it is a
            # Kconfig-derived string from the DEFAULT_BBR/DEFAULT_CUBIC
            # choice block (net/ipv4/Kconfig), not an independent
            # setting. A prior edit here dropped CONFIG_DEFAULT_BBR=y
            # entirely while keeping the bogus derived-string write,
            # leaving the choice with no selected member at all --
            # this crashed syncconfig into an unanswerable interactive
            # prompt (EOF on CI stdin) and corrupted every symbol
            # resolved after it, including CONFIG_SCHED_WALT.
            # CONFIG_DEFAULT_BBR=y alone is sufficient.
            echo ""
            echo "# I/O scheduler — PitchKernel"
            echo "# CONFIG_IOSCHED_CFQ is not set"
            echo "CONFIG_MQ_IOSCHED_DEADLINE=y"
            echo 'CONFIG_DEFAULT_IOSCHED="mq-deadline"'
          } >> "$DEFCONFIG"

          cd apasitu
          ./scripts/config --file arch/arm64/configs/munch_defconfig \
            --enable MQ_IOSCHED_DEADLINE \
            --disable IOSCHED_CFQ \
            --disable MQ_IOSCHED_KYBER \
            --set-str DEFAULT_IOSCHED "mq-deadline" \
            --enable SCSI_MQ_DEFAULT \
            --enable BLK_WBT_MQ
          cd ..


          # Thermal subsystem — fix for ThermalHalWrapper HAL read failures
          # (36 "Sensor Temperature read failure" errors per 8 minutes in logcat)
          cd apasitu
          ./scripts/config --file arch/arm64/configs/munch_defconfig \
            --enable THERMAL \
            --enable THERMAL_OF \
            --enable THERMAL_GOV_STEP_WISE \
            --enable QCOM_TSENS \
            --enable QCOM_SPMI_TEMP_ALARM
          cd ..

          echo "Patched defconfig (tail -20):"
          tail -20 "$DEFCONFIG"
          echo ""
          echo "Verifying uclamp directives:"
          grep -E "UCLAMP_TASK|LOCALVERSION_AUTO" "$DEFCONFIG" || echo "WARNING: grep found nothing"

      - name: Setup ccache
        run: |
          # Pinned version, installed directly -- do NOT apt-get install ccache.
          # apt's ccache drops compiler-name symlinks under /usr/lib/ccache/
          # that silently shadow this binary if both land on PATH. Confirmed
          # incident: two ccache installs racing on PATH caused `ccache -s` to
          # report 0.0/5.0 GiB used against a real ~1.4G on-disk cache dir.
          # Only this one binary may be on PATH for the build.
          CCACHE_VERSION="4.10.2"
          wget -q "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-linux-x86_64.tar.xz" -O ccache.tar.xz
          tar -xf ccache.tar.xz
          sudo install -m 755 "ccache-${CCACHE_VERSION}-linux-x86_64/ccache" /usr/local/bin/ccache
          rm -rf ccache.tar.xz "ccache-${CCACHE_VERSION}-linux-x86_64"
          ccache --version | head -1
          echo "All ccache binaries visible on PATH (should be exactly one):"
          which -a ccache || type -a ccache

      - name: Restore ccache
        if: ${{ !inputs.skip_ccache }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          # Key includes OS, pinned clang release, defconfig content hash, and
          # the matrix variant (zip_type: resukisu-nosusfs /
          # stock each compile a materially different set of translation
          # units, and SUSFS_ENABLE toggles ~10 Kconfig symbols that change
          # which .o files get built at all -- these MUST NOT share a cache
          # key across matrix jobs, or two variants running concurrently in
          # the same matrix will race on actions/cache's key and silently
          # cross-contaminate each other's object cache). restore-keys fall
          # back progressively so a partial match beats a cold cache, scoped
          # to the same variant only.
          #
          # KNOWN GAP (found 2026-07-18): this key does NOT hash the kernel
          # source tree itself -- only the defconfig file. A .c-file-only
          # change (e.g. kernel/sched/walt.c) does not change this key at
          # all, so ccache restores the full prior-run cache unconditionally.
          # CCACHE_COMPILERCHECK=content is supposed to catch this per-object
          # via content hashing regardless of the restore key, but a same-day
          # source-only patch (sched/walt: delay big->prime escalation,
          # commit 91878c475efc) did not show up in the resulting boot image
          # (sched_upmigrate read back 95/95, stock, instead of the expected
          # 95/97) on a build with a 99.84% ccache hit rate. Root cause not
          # yet confirmed -- skip_ccache exists to test this in isolation.
          # If a skip_ccache=true run DOES produce the correct compiled
          # value, the key needs to incorporate a source-tree hash (e.g. the
          # cloned commit SHA) directly, not just rely on ccache's internal
          # content check.
          key: ccache-munch-${{ runner.os }}-neutronclang23-30062026-${{ matrix.zip_type }}-${{ inputs.source_branch_override != '' && inputs.source_branch_override || 'main' }}-${{ hashFiles('apasitu/arch/arm64/configs/munch_defconfig') }}
          restore-keys: |
            ccache-munch-${{ runner.os }}-neutronclang23-30062026-${{ matrix.zip_type }}-
            ccache-munch-${{ runner.os }}-neutronclang23-30062026-

      - name: Build kernel
        # PitchKernel: log capture redesigned after a measured regression.
        # Original design piped 8000+ build-output lines through BOTH
        # `2> >(grep -v ...)` (process substitution) AND `tee` (live disk
        # write + live stream duplication) simultaneously. A controlled test
        # (tee/filter removed, 3 consecutive identical-SHA builds) showed
        # per-compile-call time went 325-355ms -> 105ms with the same 8014
        # call count -- a real 3x regression caused by that combination, not
        # imagined. Root cause: synchronous per-line overhead from two
        # concurrent consumers of a live stdout/stderr stream during the
        # hottest part of the build.
        #
        # Fix: capture to file with a single buffered redirect
        # (`> "$LOG" 2>&1`), no tee, no process substitution, no live
        # duplication to the GHA console during compilation. This does mean
        # per-line output will not appear in the live Actions log in real
        # time -- it is written straight to file and only the final summary
        # echoes below are visible live. The full log is still available to
        # every subsequent step via $LOG (the "Annotate known-benign build
        # noise" and "Check for unclassified build errors" steps both read
        # it), and is uploaded as an artifact on failure so nothing is lost,
        # it just is not streamed live. This is the tradeoff that avoids the
        # measured 3x regression: if live streaming during compilation is
        # ever required again, it needs a different mechanism than tee+grep
        # on every line (e.g. periodic `tail -f` sampling), not this.
        env:
          KBUILD_BUILD_TIMESTAMP: ''
          KBUILD_BUILD_USER: pitchkernel
          KBUILD_BUILD_HOST: github-actions
          CCACHE_DIR: /home/runner/.cache/ccache_mikernel
          CCACHE_MAXSIZE: 5G
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: 'true'
          CCACHE_COMPRESSLEVEL: '6'
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
          CCACHE_BASEDIR: ${{ github.workspace }}
          # PitchKernel: LTO, ccache, and make -j parallelism are all ruled
          # out with direct build-log evidence as causes of "LLVM ERROR: IO
          # failure on output stream: Broken pipe" (see build.sh's comment
          # near the JOBS variable, and history in this file's prior
          # revisions, for the full evidence trail). PITCHKERNEL_NO_CCACHE
          # and PITCHKERNEL_SERIAL_BUILD flags remain available in build.sh
          # if a future regression needs re-testing, but neither should be
          # set for normal builds -- both make builds significantly slower
          # for no benefit now that the question they answer is closed.
        run: |
          cd apasitu
          chmod +x build.sh build-miui.sh
          LOG="/tmp/pitchkernel-build-step.log"

          set +e
          # PitchKernel: matrix.root_arg carries the literal apasitu/build.sh
          # positional args for this variant (see matrix.include above) --
          # "" for vanilla, "ksu nosusfs" for ReSukiSU, "kernelsu" for plain
          # KernelSU. Replaces the old two-way ksu_enable branch, which had
          # no way to express a third root provider without another
          # hardcoded if/else here.
          bash ${{ inputs.script }} munch ${{ matrix.root_arg }} > "$LOG" 2>&1
          BUILD_EXIT=$?
          set -e

          echo "### Build step finished, exit code: $BUILD_EXIT ###"
          echo "Full output captured to $LOG ($(wc -l < "$LOG") lines)."
          echo "Last 60 lines:"
          tail -60 "$LOG"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::build.sh exited $BUILD_EXIT — see full log above/artifact."
            exit "$BUILD_EXIT"
          fi

      - name: Verify walt.o actual compiled bytes for margin_up
        # PitchKernel: diagnostic added 2026-07-18, fixed same day. First
        # version of this step assumed sysctl_sched_capacity_margin_up sits
        # at the very start of .data (true on a tiny isolated test object,
        # false on a real walt.o with dozens of other statics ahead of it --
        # real offset was 0x174) and reported (0,0), a false negative from
        # the diagnostic itself, not a real finding about the kernel. Now
        # calls scripts/pitchkernel_extract_margin.py, which reads the
        # symbol table for the real offset first instead of assuming 0x0.
        #
        # CORRECTED 2026-07-18 (was wrong in an earlier revision of this
        # comment): this step runs AFTER "Build kernel" completes, and
        # "Build kernel" is a single `bash build.sh` call that runs BOTH the
        # AOSP pass and the MIUI pass internally, sequentially, reusing (not
        # wiping) the same out/ dir, MIUI last. So by the time this step
        # runs, out/kernel/sched/walt.o already reflects the LAST make
        # invocation that touched it -- most likely the MIUI pass, not AOSP
        # -- based on mtime evidence (walt.o mtime landed ~3 min before this
        # step ran, consistent with the very end of build.sh's full run, not
        # the much-earlier AOSP-only midpoint). Not fully certain incremental
        # `make` genuinely recompiled walt.o a second time vs. left the AOSP
        # object in place untouched -- if the value here ever looks stock
        # despite a real source change, that ambiguity is where to look next
        # (add `-d` / verbose flag to the second make call, or force a
        # `touch kernel/sched/walt.c` before the MIUI make to guarantee a
        # real recompile and remove the ambiguity).
        run: |
          cd apasitu
          # This whole diagnostic exists to verify a WALT-specific tuning
          # value (sysctl_sched_capacity_margin_up) survived compilation
          # correctly -- it has no meaning when CONFIG_SCHED_WALT is
          # disabled (PELT builds), where walt.o is never compiled at all
          # (see kernel/sched/Makefile: obj-$(CONFIG_SCHED_WALT) += walt.o
          # ...). Skip cleanly rather than fatally when that's the case,
          # instead of assuming WALT is always on the way this step
          # originally did.
          if grep -q "^# CONFIG_SCHED_WALT is not set" out/.config 2>/dev/null; then
            echo "CONFIG_SCHED_WALT is disabled in this build (PELT) -- walt.o is not expected to exist. Skipping this WALT-specific diagnostic."
            exit 0
          fi
          OBJ="out/kernel/sched/walt.o"
          if [ ! -f "$OBJ" ]; then
            echo "FATAL: $OBJ not found -- was walt.c even compiled this run?"
            find out -name "walt.o" 2>/dev/null || echo "(no walt.o anywhere under out/)"
            exit 1
          fi
          echo "$OBJ exists, size: $(stat -c%s "$OBJ") bytes, mtime: $(stat -c%y "$OBJ")"

          OBJDUMP="$HOME/neutron-clang/bin/llvm-objdump"
          [ -x "$OBJDUMP" ] || OBJDUMP="llvm-objdump"

          echo "--- symbol table entry for sysctl_sched_capacity_margin_up ---"
          "$OBJDUMP" -t "$OBJ" | grep margin_up || echo "SYMBOL NOT FOUND in $OBJ"

          echo "--- extracting actual compiled value at the real symbol offset (post-build.sh, likely MIUI pass) ---"
          python3 "$GITHUB_WORKSPACE/scripts/pitchkernel_extract_margin.py" \
            "$OBJDUMP" "$OBJ" sysctl_sched_capacity_margin_up

          echo ""
          echo "--- same check against out/vmlinux (post-link, pre-KPM-patch -- closer to what actually ships) ---"
          VMLINUX="out/vmlinux"
          if [ -f "$VMLINUX" ]; then
            echo "$VMLINUX exists, size: $(stat -c%s "$VMLINUX") bytes, mtime: $(stat -c%y "$VMLINUX")"
            "$OBJDUMP" -t "$VMLINUX" | grep "sysctl_sched_capacity_margin_up$" || echo "SYMBOL NOT FOUND in $VMLINUX (may be stripped)"
            python3 "$GITHUB_WORKSPACE/scripts/pitchkernel_extract_margin.py" \
              "$OBJDUMP" "$VMLINUX" sysctl_sched_capacity_margin_up
          else
            echo "$VMLINUX not found -- cannot check post-link state"
          fi

          echo ""
          echo "--- raw byte search of the actual MIUI Image that gets zipped (post-KPM-patch if KSU enabled) ---"
          # Confirmed from arch/arm64/boot/Makefile: Image = objcopy -O binary
          # from vmlinux (strips ELF wrapper/symbols, keeps raw code+data
          # bytes verbatim) -- NOT gzip (that's the separate Image.gz target,
          # unused here). So the byte pattern should survive intact unless
          # something (the KPM patcher, or packaging) actually rewrites this
          # region, making this a meaningful check, not just weak signal.
          # Caveat: an 8-byte raw match is strong but not absolute proof --
          # unlike the symbol-table-anchored walt.o/vmlinux checks above,
          # this can't rule out coincidental collision elsewhere in the
          # binary. Treat a "FOUND patched" result as good evidence, not
          # certainty; if it disagrees with the symbol-based checks, trust
          # those instead and investigate why this one differs.
          IMG="anykernel/kernels/miui/Image"
          if [ -f "$IMG" ]; then
            echo "$IMG exists, size: $(stat -c%s "$IMG") bytes, mtime: $(stat -c%y "$IMG")"
            PATCHED_HEX="3604000020040000"
            STOCK_HEX="3604000036040000"
            if od -An -tx1 -v "$IMG" | tr -d ' \n' | grep -qo "$PATCHED_HEX"; then
              echo "FOUND patched pattern (1078,1056) in $IMG -- survived KPM patch + packaging"
            elif od -An -tx1 -v "$IMG" | tr -d ' \n' | grep -qo "$STOCK_HEX"; then
              echo "FOUND STOCK pattern (1078,1078) in $IMG -- something between vmlinux and this Image reverted it"
            else
              echo "NEITHER pattern found as a raw byte match -- Image format (compression/packing) likely obscures it; inconclusive, not evidence either way"
            fi
          else
            echo "$IMG not found -- checked path may be wrong, listing anykernel/kernels/:"
            find anykernel/kernels -type f 2>/dev/null
          fi

      - name: DEBUG - snapshot ReSukiSU/SUSFS generated source layout
        # PitchKernel: temporary, one-off diagnostic step. ReSukiSU's setup.sh
        # (fetched fresh from upstream in the "Build kernel" step above) writes
        # its KSU driver source and SUSFS integration directly into the kernel
        # source tree at build time -- none of it is vendored in this repo, so
        # there is no static way to inspect its actual file layout. This is
        # needed to evaluate whether/how a SUSFS 2.2.0 backport patch (written
        # against a different KSU fork's static layout: kernel/feature/,
        # kernel/hook/, kernel/supercall/) could apply here, since those paths
        # do not exist anywhere in this repo's static source.
        #
        # Safe to run after "Build kernel": build.sh's own rm -rf calls only
        # target build output (out/, anykernel/, dts staging), never the
        # checked-out kernel source tree itself, so whatever setup.sh wrote
        # should still be present in apasitu/ at this point in the job.
        #
        # Remove this step once the SUSFS 2.2.0 investigation is resolved --
        # it exists to answer a specific open question, not as permanent CI.
        if: always()
        run: |
          cd apasitu
          echo "### Searching for KSU/SUSFS driver source actually written by setup.sh ###"
          echo ""
          echo "--- directories matching feature/hook/supercall/kernelsu/susfs (case-insensitive) ---"
          find . -type d \( -iname "*kernelsu*" -o -iname "*resukisu*" -o -iname "*susfs*" \
            -o -iname "feature" -o -iname "hook" -o -iname "supercall" \) 2>/dev/null | grep -v "^\./\.git"
          echo ""
          echo "--- files matching known SUSFS/KSU source filenames ---"
          find . -iname "susfs*.c" -o -iname "susfs*.h" -o -iname "ksu.c" -o -iname "kernel_umount.c" \
            -o -iname "setuid_hook.c" 2>/dev/null | grep -v "^\./\.git"
          echo ""
          echo "--- any KSU_SUSFS-related Kconfig entries actually present after setup.sh ran ---"
          grep -rn "KSU_SUSFS" --include="Kconfig*" . 2>/dev/null | head -30
          echo ""
          echo "--- top-level dirs in kernel source root, for orientation ---"
          ls -la .
          echo ""
          echo "--- if a KernelSU-style top-level driver dir exists, show its structure ---"
          for d in KernelSU kernelsu drivers/kernelsu; do
            if [ -d "$d" ]; then
              echo "found: $d"
              find "$d" -maxdepth 3 -type f | head -50
            fi
          done

      - name: Report ccache stats
        if: always()
        env:
          # Without this, ccache -s falls back to its default ~/.cache/ccache
          # (empty) instead of the real cache dir the build wrote to, which is
          # env-scoped to the Build kernel step only. This is why the previous
          # run reported "0.0 / 5.0 GiB" while `du` found a real 828M on disk
          # at the same path -- two different directories, not a broken cache.
          CCACHE_DIR: /home/runner/.cache/ccache_mikernel
        run: |
          ccache -s || true
          du -sh ~/.cache/ccache_mikernel 2>/dev/null || echo "cache dir not found"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache_mikernel
          # actions/cache keys are immutable once written -- a save on the same
          # restore key would silently no-op on every run after the first.
          # run_id makes each save unique; restore-keys prefix-matching on the
          # next run picks up the most recent save automatically.
          key: ccache-munch-${{ runner.os }}-neutronclang23-30062026-${{ matrix.zip_type }}-${{ inputs.source_branch_override != '' && inputs.source_branch_override || 'main' }}-${{ hashFiles('apasitu/arch/arm64/configs/munch_defconfig') }}-${{ github.run_id }}

      - name: Annotate known-benign build noise
        run: |
          # PitchKernel: several third-party tools invoked during the build
          # (ReSukiSU's setup.sh, ak3/symbol-scan utilities, wget) print raw,
          # unlabeled diagnostic lines that read like failures out of context --
          # this has already cost two full debugging round-trips (the
          # seccomp_types.h grep noise, the report_cfi_failure symbol-scan
          # miss). Nothing upstream tags these as benign, so anyone reading the
          # log has to re-derive the classification from scratch every time.
          # This step is a running registry: known-benign patterns, confirmed
          # against source, get flagged here so future log reviews (human or
          # AI) start from a known baseline instead of re-investigating noise
          # that's already been traced and closed out.
          #
          # Adding a new entry: only add a pattern here after tracing it to a
          # real, harmless, upstream/third-party root cause -- the same bar
          # used for the entries below. This file is not a place to silence
          # things that are merely inconvenient or unexplained.
          LOG="/tmp/pitchkernel-build-step.log"
          [ -f "$LOG" ] || { echo "No build-step log captured -- skipping annotation."; exit 0; }

          echo "### Known-benign noise check ###"
          echo ""

          check_pattern() {
            local pattern="$1"
            local label="$2"
            local count
            count=$(grep -c "$pattern" "$LOG" || true)
            if [ "$count" -gt 0 ]; then
              echo "[benign] x$count -- $label"
              echo "         pattern: $pattern"
            fi
          }

          check_pattern "seccomp_types.h: No such file or directory" \
            "ReSukiSU compat probe checks a GKI-era (5.x+) header that does not exist on this 4.19.325 non-GKI tree; grep fails harmlessly and ReSukiSU skips that compat shim. See build.yml 'Build kernel' step for the stderr filter and full explanation."

          check_pattern "no symbol: report_cfi_failure" \
            "Symbol-scan tool checks for a name that has never existed in this kernel or ReSukiSU's shipped code under any config; the real exported symbol is cfi_failure_handler (kernel/cfi.c). CONFIG_CFI_CLANG=y with CONFIG_CFI_PERMISSIVE unset (enforcing mode) is correct and consistent with this miss. No fix needed."

          check_pattern "Error in reading or end of file." \
            "wget's own benign notice when opening a fresh connection with no prior resume state; the download it precedes (patch_linux from SukiSU-Ultra releases) completes normally in the following lines."

          echo ""
          echo "Any other ERROR/FATAL/WARNING text in the log that is NOT listed above"
          echo "has not been traced and classified yet -- treat it as a real signal,"
          echo "not noise, until it has been."

      - name: Check for LLVM LTO broken-pipe errors
        run: |
          # PitchKernel: munch_defconfig sets CONFIG_LTO_CLANG=y without
          # CONFIG_THINLTO, so LTO codegen runs in full/monolithic mode with
          # its own internal worker threads (Makefile ~line 895-903,
          # KBUILD_LDFLAGS). On the 4-core ubuntu-24.04 runner this
          # previously produced "LLVM ERROR: IO failure on output stream:
          # Broken pipe" from lld's LTO backend, up to 463 times in a single
          # build (run 29497655576), interleaved throughout normal CC output
          # rather than clustered at one point. That build still linked and
          # booted, but nothing verified none of those 463 events touched a
          # corrupted-but-still-linkable object -- an LTO analog of the
          # KSU_SUSFS silent-drop incident the "Verify SUSFS actually
          # compiled in" step below already exists to catch. build.sh now
          # caps LTO's internal thread count via `-mllvm -threads=N` to
          # remove the resource contention that causes this. This step is
          # the gate: if the pattern reappears, that cap did not work (or
          # was bypassed, e.g. by a build.sh edit that stopped exporting
          # KBUILD_LDFLAGS) and the build must not ship unverified.
          #
          # This intentionally hard-fails, unlike "Annotate known-benign
          # build noise" above. That step is for patterns confirmed benign
          # after tracing to a harmless upstream cause. This pattern is NOT
          # in that category -- it is a known-real LLVM/lld failure mode
          # that happened not to corrupt output on past runs. Do not move
          # this into the benign registry; if the thread cap makes it stop
          # appearing entirely (the expected outcome), that is this gate
          # doing its job, not a reason to soften it.
          LOG="/tmp/pitchkernel-build-step.log"
          [ -f "$LOG" ] || { echo "No build-step log captured -- cannot check. Failing closed."; exit 1; }

          COUNT=$(grep -c "LLVM ERROR: IO failure on output stream: Broken pipe" "$LOG" || true)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Found $COUNT occurrence(s) of 'LLVM ERROR: IO failure on output stream: Broken pipe' in the build log."
            echo "This is a known LTO/lld resource-contention failure mode (full LTO + make -j\$(nproc) double-parallelism on a 4-core runner)."
            echo "build.sh's LTO_LINK_JOBS thread cap (KBUILD_LDFLAGS=-mllvm -threads=N) should have prevented this — check that it is still present and still exported before MAKE_ARGS is used."
            echo "Do not classify this as benign noise without re-tracing it: a broken pipe mid-LTO-codegen has not been proven safe, only observed to not have broken past builds."
            exit 1
          fi

          echo "No LLVM LTO broken-pipe errors found in build log. LTO thread cap is holding."

      - name: Upload full build log on failure
        # PitchKernel: originally placed right after "Build kernel" -- wrong.
        # if: failure() only evaluates true once some step earlier in the job
        # has already failed. build.sh itself can exit 0 (compile+package
        # succeeds) while a later gate step (e.g. the broken-pipe check above)
        # is what actually fails the job -- confirmed in run 79949305509,
        # where build.sh produced a flashable zip successfully and this step,
        # in its old position, never ran because nothing had failed yet at
        # that point in sequence. Moved here, after every step that can
        # currently fail the job (LTO gate, and SUSFS-compiled-in gate below
        # would also need this if it can fail before packaging -- verify if
        # that step is ever moved earlier than this one). If more hard-fail
        # gates are added later in the job, keep this upload step positioned
        # after all of them, not just the LTO one.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pitchkernel-build-step-log
          path: /tmp/pitchkernel-build-step.log
          retention-days: 7

      - name: Verify SUSFS symbols did not leak in
        run: |
          # This step exists because of a real incident: a prior CI change swapped
          # the root provider in apasitu/build.sh (ReSukiSU -> KernelSU-Next) without
          # touching the `scripts/config -e KSU_SUSFS ...` block that follows it.
          # KSU_SUSFS is not a real Kconfig symbol unless the root provider's tree
          # actually contains susfs source. scripts/config does not validate against
          # Kconfig — it blindly writes the .config line — and kbuild silently drops
          # unrecognized symbols during syncconfig. That can silently ship a build
          # mislabeled with respect to what it actually contains.
          #
          # PitchKernel: SUSFS variant removed entirely (ReSukiSU's current hook
          # API has no available SUSFS source for this 4.19 non-GKI target -- see
          # matrix comment above). This gate now only checks the mirror-image
          # failure: that SUSFS symbols never leak into a build that should not
          # have them, e.g. a bad merge that dropped a `-d KSU_SUSFS...` line in
          # build.sh.
          if [ "${{ matrix.ksu_enable }}" != "true" ]; then
            echo "matrix.ksu_enable=false (variant: ${{ matrix.label }}) — no KSU/SUSFS expected, skipping verification."
            exit 0
          fi

          CONFIG_FILE="apasitu/out/.config"
          [ -f "$CONFIG_FILE" ] || { echo "FATAL: $CONFIG_FILE not found — build may not have produced a config"; exit 1; }

          # PitchKernel: expanded from 5 to all 9 KSU_SUSFS_* sub-symbols.
          # Note: every one of these has "depends on KSU_SUSFS" in
          # KernelSU/kernel/Kconfig, so kbuild's own syncconfig/olddefconfig
          # already forces all 9 to n whenever KSU_SUSFS=n, regardless of
          # what scripts/config's explicit -d calls in build.sh do -- this
          # gate checking all 9 isn't covering a real gap so much as it is
          # removing reliance on "kbuild's dependency graph enforces this
          # correctly" as an unverified assumption. Explicit is better than
          # implicit for a gate whose whole purpose is not trusting labels.
          SUSFS_SYMS="CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP"

          echo "Checking $CONFIG_FILE for KSU (expect PRESENT) and SUSFS symbols (variant: ${{ matrix.label }}, expect ABSENT)..."
          BAD=0
          if grep -q "^CONFIG_KSU=y" "$CONFIG_FILE"; then
            echo "  OK: CONFIG_KSU=y"
          else
            echo "  MISSING: CONFIG_KSU is not set to y — this variant should still have KSU, just not SUSFS"
            BAD=1
          fi

          for SYM in $SUSFS_SYMS; do
            if grep -q "^${SYM}=y" "$CONFIG_FILE"; then
              echo "  LEAKED: ${SYM}=y is set, but variant '${{ matrix.label }}' should not have SUSFS"
              BAD=1
            else
              echo "  OK: ${SYM} is not set to y"
            fi
          done

          if [ "$BAD" -eq 1 ]; then
            echo ""
            echo "FATAL: variant '${{ matrix.label }}' is labeled as having no SUSFS, but either"
            echo "KSU is missing or SUSFS symbols leaked into the config anyway. Do not let this"
            echo "build ship claiming no SUSFS with SUSFS features actually present -- that is a"
            echo "false security/behavior guarantee to end users. Check apasitu/build.sh for a"
            echo "dropped '-d KSU_SUSFS...' line."
            exit 1
          fi

          echo "'${{ matrix.label }}' verification passed — KSU present, SUSFS genuinely absent, not just unlabeled."

      - name: Verify uclamp actually compiled in
        run: |
          # Same failure class as the SUSFS incident above, different symbol:
          # the "Patch defconfig" step previously contained a hardcoded
          # `scripts/config --disable UCLAMP_TASK --disable UCLAMP_TASK_GROUP`
          # block that silently overwrote the kernel source's own defconfig
          # settings on every single CI run, regardless of what the tree
          # actually shipped. That block was removed, but nothing enforced
          # that it stays removed — a future edit to this file, or a merge
          # from a branch that still has it, would reintroduce the same
          # silent regression. This step checks the real generated .config,
          # not a label, not a filename, not a comment.
          CONFIG_FILE="apasitu/out/.config"
          [ -f "$CONFIG_FILE" ] || { echo "FATAL: $CONFIG_FILE not found — build may not have produced a config"; exit 1; }

          echo "Checking $CONFIG_FILE for uclamp symbols..."
          MISSING=0
          for SYM in CONFIG_UCLAMP_TASK CONFIG_UCLAMP_TASK_GROUP; do
            if grep -q "^${SYM}=y" "$CONFIG_FILE"; then
              echo "  OK: ${SYM}=y"
            else
              echo "  MISSING: ${SYM} is not set to y in the generated .config"
              MISSING=1
            fi
          done

          if grep -q "^CONFIG_SCHED_TUNE=y" "$CONFIG_FILE"; then
            echo "  WARNING: CONFIG_SCHED_TUNE=y is also set — this is Kconfig-mutually-exclusive"
            echo "  with CONFIG_UCLAMP_TASK (depends on !UCLAMP_TASK). If UCLAMP_TASK=y above,"
            echo "  Kconfig has already forced SCHED_TUNE off internally regardless of this line,"
            echo "  so it's stale rather than actively conflicting -- but it should be removed"
            echo "  from the defconfig source so the file stops claiming something false."
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "FATAL: uclamp is not actually compiled in. Do not let this build ship."
            echo "Check .github/workflows/build.yml's 'Patch defconfig' step for a"
            echo "reintroduced '--disable UCLAMP_TASK' / '--disable UCLAMP_TASK_GROUP' block,"
            echo "and check arch/arm64/configs/munch_defconfig directly for the same."
            exit 1
          fi

          echo "uclamp verification passed — real, not just labeled."

      - name: Verify touch tuning defaults actually landed
        run: |
          # Same failure class as the SUSFS and uclamp incidents above:
          # a source-level default can be silently reverted by a merge,
          # a stale patch, or a future hand-edit of the dtsi without
          # anyone noticing, since nothing previously enforced it.
          #
          # This checks the actual dtsi SOURCE that was compiled, not a
          # label or comment. It intentionally does NOT check the compiled
          # .dtb (no dtc-based verification exists elsewhere in this
          # pipeline yet, and adding one is out of scope for this gate).
          #
          # PitchKernel context: touch-def-array indexes into
          # touch-range-array = <1 5 10 15 20> for four Focaltech touch
          # tuning modes (up-threshold, tolerance, aim-sensitivity,
          # tap-stability). Stock/original default was <3 3 3 3>.
          # PitchKernel nudges this to <2 2 2 2> as a conservative,
          # reversible change -- direction (lower = more responsive) is
          # NOT empirically confirmed on-device, see the dtsi comment
          # and drivers/input/touchscreen/xiaomi/xiaomi_touch.c's
          # touch_tuning_debug sysfs node for on-device verification.
          DTSI_FILE="apasitu/arch/arm64/boot/dts/vendor/qcom/munch-sm8250.dtsi"
          [ -f "$DTSI_FILE" ] || { echo "FATAL: $DTSI_FILE not found"; exit 1; }

          echo "Checking $DTSI_FILE for touch-def-array..."
          if grep -q "focaltech,touch-def-array = <2 2 2 2>;" "$DTSI_FILE"; then
            echo "  OK: focaltech,touch-def-array = <2 2 2 2>;"
          else
            echo "  FATAL: touch-def-array is not <2 2 2 2> in $DTSI_FILE"
            echo "  Current value:"
            grep "focaltech,touch-def-array" "$DTSI_FILE" || echo "    (property not found at all)"
            exit 1
          fi

          echo "Touch tuning defaults verification passed — real, not just labeled."

      - name: Verify pitchkernel scripts are in the AK3 overlay
        run: |
          for f in pitchkernel_cpufreq.sh pitchkernel_banking_prep.sh pitchkernel_sepolicy.sh pitchkernel_v3_tuning.sh; do
            TARGET="PitchKernel/anykernel-vendor/patch/$f"
            if [ ! -f "$TARGET" ]; then
              echo "FATAL: $TARGET missing from repo — will not be installed to post-fs-data.d"
              exit 1
            fi
            if [ ! -x "$TARGET" ]; then
              echo "WARNING: $TARGET is not executable — fixing"
              chmod 755 "$TARGET"
            fi
            # Verify the script has a PitchKernel log line (so logcat tag will appear on device).
            # Accounts for both a hardcoded tag (log -p i -t PitchKernel ...) and a tag set via a
            # variable (LOG_TAG="PitchKernelV3" ... log -p i -t "$LOG_TAG" ...), since the latter
            # is a legitimate pattern (e.g. versioned tags for logcat -s PitchKernelV3) and
            # should not be flagged as silent just because grep cannot see through the variable.
            if grep -q "log -p.*PitchKernel" "$TARGET"; then
              : # hardcoded tag present
            elif grep -qE '^[[:space:]]*LOG_TAG=.*PitchKernel' "$TARGET" && grep -q 'log -p.*"$LOG_TAG"' "$TARGET"; then
              : # tag set via LOG_TAG variable and used in a log -p call
            else
              echo "WARNING: $TARGET has no 'log -p.*PitchKernel' line (hardcoded or via LOG_TAG) — boot execution will be silent"
            fi
            echo "OK: $TARGET"
          done

      - name: Verify ak3-core.sh is complete
        run: |
          TARGET="apasitu/anykernel/tools/ak3-core.sh"
          [ -f "$TARGET" ] || { echo "ERROR: $TARGET not found — build may have failed"; exit 1; }
          LINES=$(wc -l < "$TARGET")
          echo "ak3-core.sh: $LINES lines"
          if [ "$LINES" -lt 900 ]; then
            echo "FATAL: ak3-core.sh is truncated at $LINES lines."
            echo "This file comes from PitchKernel/anykernel-vendor/tools/ak3-core.sh,"
            echo "vendored directly in this repo (kernel_xiaomi_munch) -- there is no"
            echo "external fork or clone in the loop anymore. Fix it in place:"
            echo ""
            echo "  cd kernel_xiaomi_munch"
            echo "  curl -fsSL https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/tools/ak3-core.sh \\"
            echo "    -o PitchKernel/anykernel-vendor/tools/ak3-core.sh"
            echo "  git add PitchKernel/anykernel-vendor/tools/ak3-core.sh"
            echo "  git commit -m 'fix: restore complete ak3-core.sh in vendored AnyKernel3'"
            echo "  git push"
            exit 1
          fi
          bash -n "$TARGET" || { echo "FATAL: ak3-core.sh has a syntax error"; exit 1; }
          echo "ak3-core.sh OK ($LINES lines, passes bash -n)"

      - name: Verify vendored AnyKernel3 overlay is intact
        # PitchKernel: previously "Overlay PitchKernel AnyKernel3 files" -- it
        # used to actively COPY PitchKernel/anykernel/* on top of apasitu/anykernel
        # (which used to be a fresh clone of MujinnPark/AnyKernel3, now deleted).
        #
        # That copy step is gone. PitchKernel/anykernel-vendor/ in THIS repo is
        # now the single source of truth for the whole AnyKernel3 tree (AstideLabs
        # base + PitchKernel overlay merged together, committed directly), and it
        # was already seeded into apasitu/anykernel by the "Neutralize apasitu's
        # AnyKernel3 clone" step BEFORE build.sh ran -- build.sh's own
        # `rm -rf anykernel/kernels/` only clears the kernels/ subdir, so
        # everything else placed there before the build survives untouched.
        #
        # This step no longer overlays anything -- it just verifies that survived
        # correctly, so a bug in build.sh's internal handling of anykernel/ (or a
        # future change to it) doesn't ship a build with a stock, un-customized
        # AnyKernel3 silently substituted in.
        run: |
          AK3_BUILT="apasitu/anykernel"
          [ -d "$AK3_BUILT" ] || { echo "ERROR: $AK3_BUILT not found — build failed or wiped it"; exit 1; }

          echo "Verifying PitchKernel customizations survived build.sh..."
          grep -m1 "PitchKernel by Mujinn" "$AK3_BUILT/anykernel.sh" \
            || { echo "ERROR: anykernel.sh does not look like our version"; exit 1; }
          grep -m1 "PitchKernel" "$AK3_BUILT/patch/pitchkernel_cpufreq.sh" \
            || { echo "ERROR: pitchkernel_cpufreq.sh missing expected content"; exit 1; }
          test -f "$AK3_BUILT/patch/pitchkernel_banking_prep.sh" \
            || { echo "ERROR: pitchkernel_banking_prep.sh missing"; exit 1; }
          test -f "$AK3_BUILT/patch/pitchkernel_v3_tuning.sh" \
            || { echo "ERROR: pitchkernel_v3_tuning.sh missing"; exit 1; }
          test -f "$AK3_BUILT/tools/ak3-core.sh" \
            || { echo "ERROR: tools/ak3-core.sh missing — vendored tree incomplete"; exit 1; }
          test -f "$AK3_BUILT/META-INF/com/google/android/update-binary" \
            || { echo "ERROR: update-binary missing — vendored tree incomplete"; exit 1; }
          echo "Vendored AnyKernel3 overlay intact."

      - name: Package zip
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          # PitchKernel: TYPE/ARTIFACT_LABEL now come straight from the matrix
          # entry (matrix.zip_type: resukisu-nosusfs / stock)
          # instead of being reconstructed from a single ksu boolean. This is
          # what actually keeps the two variants' artifacts/zips from colliding
          # under the same filename within one workflow run.
          TYPE="${{ matrix.zip_type }}"
          ARTIFACT_LABEL="${{ matrix.zip_type }}"
          echo "BUILD_DATE=${DATE}" >> $GITHUB_ENV
          echo "BUILD_TYPE=${TYPE}" >> $GITHUB_ENV
          echo "ARTIFACT_LABEL=${ARTIFACT_LABEL}" >> $GITHUB_ENV

          AOSP_SRC_ZIP=$(find apasitu -maxdepth 1 -name "PitchKernel_AOSP_*.zip" | head -1)
          if [ -z "$AOSP_SRC_ZIP" ] || [ ! -f "$AOSP_SRC_ZIP" ]; then
            echo "ERROR: PitchKernel_AOSP_*.zip not found. Available zips:"
            find apasitu -maxdepth 1 -name "*.zip"
            exit 1
          fi
          echo "AOSP source: $AOSP_SRC_ZIP ($(du -sh $AOSP_SRC_ZIP | cut -f1))"

          # build.sh (the "AOSP+MIUI dual zip" path) also produces PitchKernel_MIUI_*.zip
          # with its own Image/dtb/dtbo.img — these are NOT interchangeable with the
          # AOSP ones (different config, different dtbo). Both must be present for
          # the dual-image AK3 flash pattern to actually work for MIUI/HyperOS users.
          MIUI_SRC_ZIP=$(find apasitu -maxdepth 1 -name "PitchKernel_MIUI_*.zip" | head -1)
          if [ -z "$MIUI_SRC_ZIP" ] || [ ! -f "$MIUI_SRC_ZIP" ]; then
            echo "ERROR: PitchKernel_MIUI_*.zip not found. Available zips:"
            find apasitu -maxdepth 1 -name "*.zip"
            echo "If you intentionally ran a build that skips MIUI, this packaging step"
            echo "needs a --skip-miui flag added — it currently assumes both zips exist."
            exit 1
          fi
          echo "MIUI source: $MIUI_SRC_ZIP ($(du -sh $MIUI_SRC_ZIP | cut -f1))"

          mkdir -p /tmp/kernel_files/aosp /tmp/kernel_files/miui
          unzip -q -j "$AOSP_SRC_ZIP" \
            "kernels/aosp/Image" \
            "kernels/aosp/dtb" \
            "kernels/aosp/dtbo.img" \
            -d /tmp/kernel_files/aosp/
          unzip -q -j "$MIUI_SRC_ZIP" \
            "kernels/miui/Image" \
            "kernels/miui/dtb" \
            "kernels/miui/dtbo.img" \
            -d /tmp/kernel_files/miui/

          for os in aosp miui; do
            for f in Image dtb dtbo.img; do
              if [ ! -f "/tmp/kernel_files/$os/$f" ]; then
                echo "ERROR: $f not found for $os"
                exit 1
              fi
            done
          done
          echo "Kernel files:"
          ls -lh /tmp/kernel_files/aosp /tmp/kernel_files/miui

          AK3_DIR="apasitu/anykernel"
          [ -d "$AK3_DIR" ] || { echo "ERROR: $AK3_DIR not found"; ls apasitu/; exit 1; }

          WORKDIR="/tmp/ak3_build"
          rm -rf "$WORKDIR"
          cp -r "$AK3_DIR" "$WORKDIR"

          CORE_LINES=$(wc -l < "$WORKDIR/tools/ak3-core.sh")
          UB_LINES=$(wc -l < "$WORKDIR/META-INF/com/google/android/update-binary")
          echo "ak3-core.sh in \$WORKDIR: $CORE_LINES lines"
          echo "update-binary in \$WORKDIR: $UB_LINES lines"
          [ "$CORE_LINES" -gt 900 ] || { echo "FATAL: ak3-core.sh truncated in WORKDIR"; exit 1; }
          bash -n "$WORKDIR/tools/ak3-core.sh" || { echo "FATAL: ak3-core.sh syntax error"; exit 1; }
          bash -n "$WORKDIR/META-INF/com/google/android/update-binary" || \
            { echo "FATAL: update-binary syntax error"; exit 1; }

          rm -rf "$WORKDIR/kernels"
          mkdir -p "$WORKDIR/kernels/aosp" "$WORKDIR/kernels/miui"
          cp /tmp/kernel_files/aosp/Image    "$WORKDIR/kernels/aosp/"
          cp /tmp/kernel_files/aosp/dtb      "$WORKDIR/kernels/aosp/"
          cp /tmp/kernel_files/aosp/dtbo.img "$WORKDIR/kernels/aosp/"
          cp /tmp/kernel_files/miui/Image    "$WORKDIR/kernels/miui/"
          cp /tmp/kernel_files/miui/dtb      "$WORKDIR/kernels/miui/"
          cp /tmp/kernel_files/miui/dtbo.img "$WORKDIR/kernels/miui/"

          [ -f "$WORKDIR/kernels/aosp/Image" ] || \
            { echo "ERROR: AOSP Image missing after copy"; exit 1; }
          [ -f "$WORKDIR/kernels/miui/Image" ] || \
            { echo "ERROR: MIUI Image missing after copy"; exit 1; }

          # Each ROM's own dtbo — do NOT cross-copy AOSP's dtbo to the MIUI slot or
          # vice versa, they come from different builds with different configs.
          cp /tmp/kernel_files/aosp/dtbo.img "$WORKDIR/munch-aosp-dtbo.img"
          cp /tmp/kernel_files/miui/dtbo.img "$WORKDIR/munch-miui-dtbo.img"

          ZIP_NAME="PitchKernel-${TYPE}-munch-${DATE}.zip"

          cd "$WORKDIR"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x ".git/*" -x "*.gitignore" >/dev/null

          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME" | grep -q "kernels/aosp/Image" || \
            { echo "ERROR: kernels/aosp/Image missing from $ZIP_NAME"; exit 1; }
          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME" | grep -q "kernels/miui/Image" || \
            { echo "ERROR: kernels/miui/Image missing from $ZIP_NAME"; exit 1; }

          cd "$GITHUB_WORKSPACE"
          echo "Packaged: $ZIP_NAME ($(du -sh $ZIP_NAME | cut -f1))"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchKernel-munch-${{ env.ARTIFACT_LABEL }}-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Send artifact to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID_ARTIFACT: ${{ secrets.TELEGRAM_THREAD_ID_ARTIFACT }}
          ZIP_PATH: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
          KERNEL_VERSION: "4.19"
          # PitchKernel: reads matrix.root_solution_key directly now that a
          # third root provider (KernelSU) exists -- the old two-way ternary
          # here (ksu_enable == 'true' -> RESUKISU_NOSUSFS) predates that and
          # would have mislabeled a KernelSU build as ReSukiSU. Each matrix
          # entry sets its own root_solution_key (see matrix.include above),
          # matching a case in telegram.sh's ROOT_DISPLAY switch.
          ROOT_SOLUTION: ${{ matrix.root_solution_key }}
          SUSFS_ENABLED: "false"
          # Was hardcoded "default (apasitu)" — meant nothing and hid the exact
          # branch/commit mismatch bug fixed in the "Clone apasitu kernel source"
          # step above. Now reflects what was actually resolved and cloned this
          # run, so a future branch drift shows up in the Telegram message
          # instead of being invisible again.
          KERNEL_BRANCH: "${{ inputs.source_branch_override != '' && inputs.source_branch_override || 'main' }}@${{ env.KERNEL_SOURCE_SHA }}"
          COMPILER_STRING: "ZyCromerZ Clang 16.0.6-20260807"
          KERNEL_SRC: "apasitu"
        run: |
          source PitchKernel/release/telegram.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # PitchKernel: tag now includes matrix.zip_type. Two matrix jobs
          # (SUSFS + NoSUSFS) run concurrently in the same workflow_dispatch
          # and would otherwise both target the same
          # "PitchKernel-munch-${DATE}" tag -- softprops/action-gh-release
          # does not hard-fail on a shared tag (it appends to the existing
          # release), but two jobs racing to create-or-update the same tag
          # concurrently is exactly the class of race this repo already hit
          # once with actions/cache (see the Restore/Save ccache comments
          # above). Scoping the tag per variant removes the race entirely
          # and gives each variant its own release notes describing exactly
          # what that specific zip contains, instead of one ambiguous
          # merged body covering both.
          tag_name: PitchKernel-munch-${{ matrix.zip_type }}-${{ env.BUILD_DATE }}
          name: "PitchKernel ${{ env.BUILD_DATE }} — munch (${{ matrix.label }})"
          body: |
            ## PitchKernel — Poco F4 / Redmi K40S (munch)

            **Build date:** ${{ env.BUILD_DATE }}
            **Variant:** ${{ matrix.label }}
            **Type:** ${{ env.BUILD_TYPE }}
            **Base:** MujinnPark/pitch_kernel_sm8250 @ `${{ inputs.source_branch_override != '' && inputs.source_branch_override || 'main' }}` (`${{ env.KERNEL_SOURCE_SHA }}`)
            **Toolchain:** ZyCromerZ Clang 16.0.6-20260807

            ### Features
            - Root: ${{ matrix.root_provider == 'none' && 'none (vanilla, no root)' || matrix.root_provider }}
            - SUSFS: ${{ matrix.root_solution_key == 'RESUKISU_NOSUSFS' && 'not available — ReSukiSU only, no compatible SUSFS source for this 4.19 non-GKI target' || (matrix.root_solution_key == 'KERNELSU' && 'not supported by this root provider (plain KernelSU has no SUSFS integration)' || 'not applicable (no root)') }}
            - TCP BBR congestion control
            - ROM auto-detection: MIUI/HyperOS or AOSP
            - CPU prime core ceiling: 2841600 kHz (hardware-enforced by qcom-cpufreq-hw driver)

            ### Installation
            Flash via OrangeFox or TWRP.
            Select ROM type during flash (auto-detected from zip name, volume-key fallback).
            cpufreq script placed in `/data/adb/post-fs-data.d/` automatically — no separate module needed.
          files: ${{ env.ZIP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          
